name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: python3 -m pytest skills/signal-scout/scripts/ -v

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Pipeline evals (runs finalize/verify/scoring code on fixture inputs, offline)
        run: python3 evals/pipeline/run.py -v
      - name: Install litmus
        # Pinned: litmus 0.3.0 replaced `gate` with mutation testing.
        run: pip install git+https://github.com/OrenSegal/litmus.git@v0.2.0
      - name: Grader check on hand-written example outputs (does not run the skill)
        run: python3 -m litmus.cli gate evals --baseline evals/baseline.json
