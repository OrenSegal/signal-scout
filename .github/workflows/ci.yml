name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: python3 -m pytest skills/signal-scout/scripts/ -v

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Pipeline evals (runs finalize/verify/scoring code on fixture inputs, offline)
        run: python3 evals/pipeline/run.py -v
      - name: Install litmus
        # Pinned: litmus 0.3.0 replaced `gate` with mutation testing.
        run: pip install git+https://github.com/OrenSegal/litmus.git@v0.2.0
      - name: Grader check on hand-written example outputs (does not run the skill)
        run: python3 -m litmus.cli gate evals --baseline evals/baseline.json

  # One stable name for the main-branch ruleset to require (.github/rulesets/main.json).
  # Matrix jobs report one check per leg, and the leg names change with the matrix.
  # This job passes only when every job above passed or was skipped.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, evals]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
