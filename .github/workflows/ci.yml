name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: python3 -m pytest skills/signal-scout/scripts/ -v

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Pipeline evals (runs finalize/verify/scoring code on fixture inputs, offline)
        run: python3 evals/pipeline/run.py -v
      - name: Install litmus
        run: pip install git+https://github.com/OrenSegal/litmus.git
      - name: Grader check on hand-written example outputs (does not run the skill)
        run: python3 -m litmus.cli gate evals --baseline evals/baseline.json
